version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins (and their
  # version comments) current through reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing a new release, so a compromised one has time
    # to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
