name: Release MCPB

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to publish (e.g., v0.1.1)'
        required: true
      ref:
        description: 'Git ref to build from (branch or tag)'
        required: false
        default: 'master'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attach-mcpb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: npm run build

      - name: Install MCPB CLI
        run: npm install --global @anthropic-ai/mcpb

      - name: Package MCPB
        run: npm run package:mcpb

      - name: Upload or create release with asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Use WORKFLOW_PAT to allow triggering the publish workflow
          # PAT needs: repo, workflow permissions
          # Falls back to GITHUB_TOKEN if PAT not configured
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
