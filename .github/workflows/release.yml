name: Release MCPB

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to publish (e.g., v0.1.1)'
        required: true
      ref:
        description: 'Git ref to build from (branch or tag)'
        required: false
        default: 'master'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attach-mcpb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: npm run build

      - name: Install MCPB CLI
        run: npm install --global @anthropic-ai/mcpb

      - name: Package MCPB
        run: npm run package:mcpb

      - name: Upload or create release with asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Use WORKFLOW_PAT to allow triggering the publish workflow
          # PAT needs: repo, workflow permissions
          # Falls back to GITHUB_TOKEN if PAT not configured
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
