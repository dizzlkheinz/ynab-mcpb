name: CI Tests

on:
  push:
    branches:
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify source
        run: npm run type-check && npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Enforce coverage
        run: npm run test:coverage

  integration-core:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run non-destructive core integration tests
        # Real-API checks remain non-blocking because credentials and YNAB rate
        # limits are external to the source verification gate.
        continue-on-error: true
        run: npm run test:integration:core
        timeout-minutes: 30
