name: Live Integration Smoke

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: live-integration-smoke
  cancel-in-progress: false

jobs:
  run-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
      RUN_LIVE_YNAB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run read-only live smoke tests
        run: npm run test:integration:live
