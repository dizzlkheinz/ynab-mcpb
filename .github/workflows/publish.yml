name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to publish (e.g., v0.17.0)'
        required: true
  release:
    types: [published]

jobs:
  publish:
    # Required to satisfy npm Trusted Publisher matching (environment name left blank in npm)
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@dizzlkheinz'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Clear npm auth to use OIDC
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Publish to npm
        run: |
          echo "Using npm Trusted Publishing (OIDC)"
          npm run test:unit
          npm publish --provenance --access public
        env:
          # Ensure we rely on OIDC-based Trusted Publishing instead of any token from setup-node
          NODE_AUTH_TOKEN: ""
