name: Publish to npm & MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to publish (e.g., v0.17.0)'
        required: true
  release:
    types: [published]

jobs:
  publish:
    # Required to satisfy npm Trusted Publisher matching (environment name left blank in npm)
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@dizzlkheinz'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          npm run test:unit
          npm publish --provenance --access public

      ### Publish to MCP Registry
      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # For workflow_dispatch, extract from input tag
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION=$(echo "${{ inputs.tag }}" | sed 's/^v//')
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "Publishing MCP Registry version: $VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
