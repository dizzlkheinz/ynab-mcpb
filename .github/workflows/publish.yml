name: Publish to npm & MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to publish (e.g., v0.17.0)'
        required: true
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Required to satisfy npm Trusted Publisher matching (environment name left blank in npm)
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      YNAB_ACCESS_TOKEN: ${{ secrets.YNAB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@dizzlkheinz'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify and build package once
        run: |
          npm run test:unit
          npm run test:coverage
          npm run build:prod

      - name: Publish to npm
        run: npm publish --ignore-scripts --provenance --access public

      ### Publish to MCP Registry
      - name: Verify committed registry metadata
        run: npm run verify:metadata

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
