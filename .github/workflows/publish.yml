name: Publish to npm & MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to publish (e.g., v0.17.0)'
        required: true
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Required to satisfy npm Trusted Publisher matching (environment name left blank in npm)
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@dizzlkheinz'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify and build package once
        run: |
          npm run type-check
          npm run test:coverage
          npm run test:integration
          npm run build

      - name: Publish to npm
        # Skipped when the version already exists, so a rerun can finish the registry publish
        run: |
          PACKAGE="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE" version > /dev/null 2>&1; then
            echo "$PACKAGE is already on npm; skipping npm publish"
          else
            npm publish --ignore-scripts --provenance --access public
          fi

      ### Publish to MCP Registry
      - name: Verify committed registry metadata
        run: npm run verify:metadata

      - name: Wait for npm to serve the version
        # The registry rejects a version npm does not serve yet, which can take several minutes
        run: |
          PACKAGE="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            npm view "$PACKAGE" version > /dev/null 2>&1 && exit 0
            echo "$PACKAGE not served by npm yet (attempt $attempt); retrying in 15s"
            sleep 15
          done
          echo "$PACKAGE was not served by npm within 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        # The registry's own npm lookup can lag behind npm view briefly
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "mcp-publisher attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
